[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitumen-analysis-api"
version = "0.1.0"
description = "FastAPI starter for a BU futures research platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.14,<2.0",
  "python-multipart>=0.0.18,<1.0",
  "openai>=2.0,<3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
